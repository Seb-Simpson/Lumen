name: Lumen checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser checks against isolated development database
        run: |
          npm run dev > /tmp/lumen-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/ > /dev/null || { cat /tmp/lumen-dev.log; exit 1; }
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            docs/screenshots
            /tmp/lumen-dev.log
